button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

.btn-soft{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px}
.tile{flex:none;width:44px;height:44px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:8px 0 0 -8px;font-size:32px;line-height:1;color:var(--fg);border-radius:12px}

.ver{font-size:12px;color:var(--sub)}

const find=n=>S.inv.find(i=>i.n===n);
function urg(it){const s=stateOf(it);return s==='soon'?10-Math.max(it.left,0):s==='buried'?5:0}

const slotDay=(i,N)=>Math.floor(i*7/N);
function makePlan(){
  const N=S.meals, sim=new Map(S.inv.map(i=>[i.n,i])), slots=[];
  for(let i=S.doneList.length;i<N;i++){
    const d=slotDay(i,N), cands=[];
    for(const r of PLAN_RECIPES){
      if(S.rej.includes(r.n))continue;
      if(![...r.uses,...r.keeps].every(n=>sim.has(n)))continue;
      if(!r.uses.every(n=>sim.get(n).left>=d))continue;
      const minLeft=r.uses.length?Math.min(...r.uses.map(n=>sim.get(n).left)):999;
      const score=r.uses.reduce((a,n)=>a+urg(sim.get(n)),0);
      cands.push({r,minLeft,score});
    }
    cands.sort((a,b)=>a.minLeft-b.minLeft||b.score-a.score);
    const list=[...cands.filter(c=>c.r.uses.length),...cands.filter(c=>!c.r.uses.length)];
    const pick=list.length?list[(S.alt[i]||0)%list.length]:null;
    if(pick)pick.r.uses.forEach(n=>sim.delete(n));
    slots.push({i,d,r:pick?pick.r:null,n:list.length});
  }
  return {slots,left:[...sim.values()]};
}
function reasonOf(r){
  if(!r.uses.length)return '급한 재료가 없어서 가볍게 먹어요';
  const it=r.uses.map(find).filter(Boolean).sort((a,b)=>a.left-b.left)[0];
  if(!it)return '';
  const st=stateOf(it);
  if(st==='soon'){const w=it.left<=0?'오늘까지':it.left===1?'내일까지':`${it.left}일 뒤까지`;return `${it.n}${iga(it.n)} ${w}라서 먼저 배치했어요`}
  if(st==='buried')return `${it.n}${iga(it.n)} ${it.ago}일째 잠들어 있어서 먼저 꺼내요`;
  return `${it.n}${eul(it.n)} 넉넉할 때 써요`;
}

function addView(){
  const n=S.pick.size;
  return `<h1>지금 냉장고에<br>어떤 재료들이 있나요?</h1>
  <p class="lead">고르기만 하세요. 소비기한은 자동으로 정해둘게요.</p>
  <div class="grid">${CATALOG.map(c=>{const own=!!find(c.n),on=S.pick.has(c.n);
    return `<button class="gi ${on?'on':''}" data-act="gpick" data-n="${esc(c.n)}" ${own?'disabled':''}><span class="e">${c.e}</span>${esc(c.n)}${own?'<small>있어요</small>':''}</button>`}).join('')}</div>
  <div class="ctas"><button class="cta ghost" data-act="tab" data-v="home">나중에 할게요</button><button class="cta" data-act="gadd" ${n?'':'disabled'}>${n?`${n}개 담기`:'재료를 골라 주세요'}</button></div>`;
}

function videoView(){
  const v=S.video;
  if(v.step==='input'){
    return `<h1>영상 속 재료,<br>냉장고에 있는지 볼까요?</h1>
    <p class="lead">쇼츠 링크를 붙여 넣으면 필요한 재료를 확인해드려요.</p>
    <input type="text" id="url" placeholder="유튜브 쇼츠 링크" value="${esc(v.url)}" autocomplete="off">
    <button class="cta" data-act="vcheck">확인하기</button>
    <button class="note" style="text-decoration:underline;display:block;margin-top:12px" data-act="vman">링크 없이 직접 입력하기</button>
    <div class="eyebrow">프로토타입이라 예시 영상만 읽을 수 있어요</div>
    ${Object.entries(RECIPES_VIDEO).map(([k,r])=>`<button class="sample-btn" data-act="vsample" data-v="${k}">${r.title}<small>예시 링크로 채우기</small></button>`).join('')}`;
  }
  if(v.step==='loading') return `<div class="pulse"><div class="spin"></div><b style="color:var(--fg);font-size:18px">영상에서 재료를 읽고 있어요</b><span>잠깐만 기다려 주세요</span></div>`;
  if(v.step==='unknown') return `<h1>이 링크는 아직 못 읽어요</h1><p class="lead">프로토타입이라 예시 영상 2개만 확인할 수 있어요.</p>
    ${Object.entries(RECIPES_VIDEO).map(([k,r])=>`<button class="sample-btn" data-act="vsample" data-v="${k}">${r.title}<small>예시 링크로 채우기</small></button>`).join('')}
    <button class="cta" data-act="vman">직접 입력하기</button>
    <button class="cta ghost" data-act="vreset">돌아가기</button>`;
  if(v.step==='manual') return `<h1>메뉴와 재료를<br>직접 적어 주세요</h1>
    <p class="lead">영상 설명을 못 읽을 때도 이어서 확인할 수 있어요. 재료는 쉼표(,)로 나눠 주세요.</p>
    <input type="text" id="mname" placeholder="메뉴 이름 (예: 제육볶음)" autocomplete="off">
    <input type="text" id="ming" style="margin-top:10px" placeholder="재료 (예: 돼지고기 앞다리살, 양파, 대파)" autocomplete="off">
    <button class="cta" data-act="vmanual">재고 확인하기</button>`;
  const r=v.rec;
  if(v.step==='confirm') return `<h1>‘${r.title}’ 영상이 맞나요?</h1>
    <p class="lead">영상에서 이런 재료를 읽었어요.</p>
    <div class="tags" style="gap:8px">${r.ing.map(i=>`<span class="tag" style="font-size:14px;padding:6px 12px">${esc(i.n)}</span>`).join('')}</div>
    <div class="ctas"><button class="cta ghost" data-act="vreset">아니에요</button><button class="cta" data-act="vok">맞아요</button></div>`;
  // result
  const rows=r.ing.map(i=>{
    const has=find(i.n);
    if(has){const s=stateOf(has);return {i,kind:'have',has,s}}
    if(i.core){
      const c=S.inv.filter(x=>x.core===i.core).sort((a,b)=>a.left-b.left);
      if(c.length)return {i,kind:'sub',sub:c[0],many:c.length>1,s:stateOf(c[0])};
    }
    return {i,kind:'none'};
  });
  const nHave=rows.filter(x=>x.kind==='have').length, nSub=rows.filter(x=>x.kind==='sub').length;
  return `<h1>${r.ing.length}개 중 ${nHave}개가 냉장고에 있어요</h1>
  <p class="lead">${r.title}${nSub?` · 대체할 수 있는 재료 ${nSub}개`:''}</p>
  <div>${rows.map(x=>{
    if(x.kind==='have')return `<div class="row">${tile(x.i.n,x.i.core)}<div class="main"><div class="nm">${esc(x.i.n)}</div><div class="meta">${esc(x.has.q)} · ${dLabel(x.has.left)}</div></div>
      ${x.s!=='ok'?`${bd(x.s)}`:''}<span class="badge b-ok">있어요</span></div>`;
    if(x.kind==='sub')return `<div class="row" style="display:block"><div style="display:flex;align-items:center;gap:12px">${tile(x.i.n,x.i.core)}<div class="main"><div class="nm">${esc(x.i.n)}</div></div><span class="badge b-none">없어요</span></div>
      <div class="sub-card"><b>${esc(x.i.n)} 말고 ${esc(x.sub.n)}${ro(x.sub.n)} 대체하는 건 어때요?</b>
      <span>냉장고에 ${esc(x.sub.n)}(${dLabel(x.sub.left)})이 있어요${x.many?' · 같은 종류 중 소비기한이 더 가까운 걸 골랐어요':''}.</span>
      ${x.s==='soon'?`<span style="color:var(--red);font-weight:700">지금 가장 급한 재료예요</span>`:x.s==='buried'?`<span style="color:var(--amber);font-weight:700">오래 숨어 있던 재료예요</span>`:''}</div></div>`;
    return `<div class="row">${tile(x.i.n,x.i.core)}<div class="main"><div class="nm">${esc(x.i.n)}</div><div class="meta">냉장고에 없어요</div></div><span class="badge b-none">없어요</span></div>`}).join('')}</div>
  <p class="note">${r.skip.join('·')} 같은 기본양념은 빼고 확인했어요. 양은 비교하지 않아요. 맛이나 식감, 알레르기는 직접 판단해 주세요.</p>
  <button class="cta ghost" data-act="vreset">다른 영상 확인하기</button>`;
}

function orderView(){
  const o=S.order;
  if(o.step==='start') return `<h1>주문 화면을 올려주세요</h1>
    <p class="lead">컬리, B마트, 쿠팡 주문 내역 캡처면 돼요. 재료와 소비기한은 알아서 정리해요.</p>
    <label class="drop" style="display:block;cursor:pointer">사진을 눌러서 고르세요<input type="file" id="file" accept="image/*" hidden></label>
    <button class="sample-btn" data-act="osample" style="margin-top:12px">예시 주문 화면으로 해볼게요<small>실제 인식 없이 정해진 결과가 나와요</small></button>
    <button class="sample-btn" data-act="tab" data-v="add">재료를 직접 골라서 담을게요<small>사진 없이 고르기만 하면 돼요</small></button>
    <p class="note">프로토타입이라 어떤 사진을 올려도 같은 예시 결과가 나와요.</p>`;
  if(o.step==='loading') return `<div class="pulse"><div class="spin"></div><b style="color:var(--fg);font-size:18px">주문 내역을 읽고 있어요</b><span>상품과 소비기한을 정리하는 중이에요</span></div>`;
  const R=RETAIL[o.retailer];
  const inDate=addDays(new Date(2026,9,26),R.checkin);
  return `<h1>${ORDER_ITEMS.length}개를 찾았어요</h1>
  <p class="lead">소비기한은 자동으로 정해뒀어요. 나중에 언제든 고칠 수 있어요.</p>
  ${o.thumb?`<img class="thumb" src="${o.thumb}" alt="올린 주문 화면">`:''}
  <div class="eyebrow">어디서 주문했나요?</div>
  <div class="seg">${Object.keys(RETAIL).map(k=>`<button class="${o.retailer===k?'on':''}" data-act="retailer" data-v="${k}">${k}</button>`).join('')}</div>
  <p class="note" style="margin-top:6px">${R.txt}<br>10월 26일 주문 → <b>${fmt(inDate)}</b>에 냉장고에 들어온 걸로 계산해요.</p>
  <div style="margin-top:8px">${ORDER_ITEMS.map(i=>`<div class="row">${tile(i.n,i.core)}<div class="main"><div class="nm">${esc(i.n)}</div><div class="meta">${i.q} · ${i.conf?'소비기한 '+i.shelf+'일 뒤까지 (표기에서 읽음)':'소비기한을 못 읽어서 '+i.shelf+'일로 자동 설정'}</div></div>
      <span class="badge ${i.conf?'b-ok':'b-info'}">${i.conf?'읽었어요':'자동 설정'}</span></div>`).join('')}</div>
  <button class="cta" data-act="oadd" ${o.added?'disabled':''}>${o.added?'냉장고에 넣었어요':'냉장고에 넣을게요'}</button>
  ${o.added?`<button class="cta ghost" data-act="tab" data-v="home">냉장고 보러 가기</button>`:''}`;
}

function planView(){
  const {slots,left}=makePlan();
  const soonNow=S.inv.filter(i=>stateOf(i)==='soon');
  const used=new Set(slots.filter(x=>x.r).flatMap(x=>x.r.uses));
  const doneSoon=S.doneList.reduce((a,d)=>a+d.soonUsed.length,0);
  const total=soonNow.length+doneSoon, saved=soonNow.filter(i=>used.has(i.n)).length+doneSoon;
  const buyAll=[...new Set(slots.filter(x=>x.r).flatMap(x=>x.r.buy))].filter(n=>!find(n));
  const kept=new Set(slots.filter(x=>x.r).flatMap(x=>x.r.keeps)), lost=left.filter(i=>!kept.has(i.n)&&(i.left<=7||stateOf(i)==='buried'));
  const tagOf=n=>{const it=find(n),st=it?stateOf(it):'ok';return `<span class="tag ${st==='soon'?'hot':st==='buried'?'bur':''}">${esc(n)}${st==='soon'?' · '+dLabel(it.left):st==='buried'?' · 잊혀지는 중':''}</span>`};
  return `<h1>이번 주 먹을 순서예요</h1>
  <p class="lead">${total?`얼른 먹어야 할 재료 ${total}개 중 ${saved}개를 이번 주 저녁에 먼저 써요.`:'급하게 써야 할 재료는 없어요.'}</p>
  <div class="eyebrow" style="margin-top:0">이번 주 집밥은 몇 번 하세요?</div>
  <div class="seg">${[2,3,4,5,6,7].map(n=>`<button class="${S.meals===n?'on':''}" data-act="meals" data-v="${n}">${n}번</button>`).join('')}</div>
  <div style="margin-top:8px">
  ${S.doneList.map((d,k)=>`<div class="day done"><div class="d"><b>✓</b><span>먹었어요</span></div><div class="body"><div class="nm" style="font-weight:700;font-size:16px">${esc(d.r.n)}</div><div class="acts" style="margin-top:8px"><button class="small-btn alt" data-act="undo" data-i="${k}">되돌리기</button></div></div></div>`).join('')}
  ${slots.map(sl=>{
    const dt=addDays(TODAY,sl.d);
    const head=`<div class="d"><b>${dt.getDate()}</b><span>${DOW[dt.getDay()]}${sl.d===0?' · 오늘':''}</span></div>`;
    if(!sl.r)return `<div class="day">${head}<div class="body"><div class="nm" style="font-weight:700;color:var(--sub)">제안할 메뉴가 없어요</div><div style="color:var(--sub);font-size:13px">재고로 만들 수 있는 메뉴가 없어요. 건너뛴 메뉴를 다시 보거나 장을 봐 주세요</div></div></div>`;
    const r=sl.r, buy=r.buy.filter(n=>!find(n));
    return `<div class="day">${head}<div class="body"><div class="nm" style="font-weight:700;font-size:16px">${esc(r.n)}</div>
      <div style="color:var(--sub);font-size:13px;margin-top:2px">${reasonOf(r)}</div>
      <div class="tags">${r.uses.map(tagOf).join('')}${r.keeps.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}${buy.map(n=>`<span class="tag buy">사야 해요 · ${esc(n)}</span>`).join('')}</div>
      <div class="acts"><button class="small-btn" data-act="meal-ok" data-i="${sl.i}">이걸로 할게요</button>${sl.n>1?`<button class="small-btn alt" data-act="swap" data-i="${sl.i}">바꾸기</button>`:''}<button class="small-btn alt" data-act="skip" data-i="${sl.i}">건너뛰기</button></div></div></div>`}).join('')}
  </div>
  ${S.rej.length?`<button class="note" style="text-decoration:underline;display:block" data-act="rejclear">건너뛴 메뉴 ${S.rej.length}개 다시 보기</button>`:''}
  ${buyAll.length?`<div class="card blue"><h3>이번 주 사야 할 재료</h3><p>${buyAll.map(esc).join(', ')} · 냉장고에 없는 재료라 따로 모았어요.</p></div>`:''}
  ${lost.length?`<div class="card"><h3>이번 주에 못 쓰는 재료</h3><p>${lost.map(i=>`${esc(i.n)}(${i.left<=7?dLabel(i.left):'잊혀지는 중'})`).join(', ')} · 집밥 횟수를 늘리거나 따로 챙겨 드세요.</p></div>`:''}
  <p class="note">‘이걸로 할게요’를 누르면 쓴 재료가 냉장고에서 빠지고, 되돌리기로 다시 살릴 수 있어요. 재료는 통째로 쓴 걸로 계산해요. 메뉴와 배치 이유는 정해진 규칙으로 만든 예시예요.</p>`;
}

// ---------- 렌더 ----------
const ICON={
  home:'<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M6 10h12M9.5 6v1.5M9.5 13v3"/></svg>',
  video:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9.5v5l4.2-2.5z"/></svg>',
  order:'<svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};
const TABS=[['home','냉장고'],['video','영상 확인'],['order','장보기 올리기'],['plan','이번 주']];
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,t])=>`<button class="tab ${(S.tab===k||(k==='home'&&S.tab==='add'))?'on':''}" data-act="tab" data-v="${k}">${ICON[k]}${t}</button>`).join('');
  let v={home:homeView,add:addView,video:videoView,order:orderView,plan:planView}[S.tab]();
  const bk=(S.tab==='order'&&S.order.step!=='start')?'oback':S.tab==='add'?'aback':(S.tab==='video'&&S.video.step!=='input')?'vreset':null;
  if(bk)v=`<button class="back" data-act="${bk}" aria-label="뒤로가기">‹</button>`+v;
  const app=document.getElementById('app');
  const y=window.scrollY; app.innerHTML=v;
  const url=document.getElementById('url'); if(url)url.oninput=e=>{S.video.url=e.target.value};
  const file=document.getElementById('file'); if(file)file.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>startOrder(rd.result);rd.readAsDataURL(f)};
  // sheet
  const L=document.getElementById('layer');
  if(S.sheet!=null){const it=S.inv[S.sheet],s=stateOf(it);
    const base=addDays(TODAY,-it.ago),src=it.src||'table';
    const srcTxt=src==='label'?'주문 화면에 적힌 소비기한':src==='user'?'직접 고친 값':`기본 기간표(임시) · 입고일 + ${it.ago+it.left}일`;
    const pc=it.pct??100,qv=pc>=75?100:pc>=40?50:25;
    L.innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1">
      ${bd(s)}
      <h1 style="margin-top:12px">${esc(it.n)}</h1>
      <p class="lead" style="margin-bottom:0">${esc(it.q)} · ${it.loc} · 들어온 지 ${it.ago}일</p>
      <div class="basis"><div><span>입고일(기준일)</span><b>${fmt(base)}</b></div><div><span>소비기한</span><b>${fmt(addDays(TODAY,it.left))} (${dLabel(it.left)})</b></div><div><span>근거</span><b>${srcTxt}</b></div>
        <div class="acts"><span style="align-self:center">기한 고치기</span><button class="small-btn alt" data-act="exp" data-v="-1">−1일</button><button class="small-btn alt" data-act="exp" data-v="1">+1일</button></div></div>
      <div class="eyebrow" style="margin-top:14px">남은 양</div>
      <div class="seg">${[[100,'넉넉해요'],[50,'반쯤'],[25,'조금']].map(([p,t])=>`<button class="${qv===p?'on':''}" data-act="qty" data-v="${p}">${t}</button>`).join('')}</div>
      <div class="ctas"><button class="btn-soft" style="background:var(--accent-bg);color:var(--accent)" data-act="eat">✓ 다 먹었어요</button><button class="btn-soft" style="background:var(--red-bg);color:var(--red)" data-act="discard">버렸어요</button></div>
      <button class="cta ghost" data-act="close">닫기</button></div></div>`;
  } else L.innerHTML='';
  if(S.toast){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=S.toast}
  else{const t=document.getElementById('toast');if(t)t.remove()}
}
let tt;function toast(m){S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},2200)}
function startOrder(thumb){S.order.step='loading';S.order.thumb=thumb||null;render();setTimeout(()=>{if(S.order.step==='loading'){S.order.step='result';render()}},1200)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  if(t.classList.contains('sheet-bg')&&e.target.closest('[data-stop]'))return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='tab'){if(v==='add')S.prev=S.tab;S.tab=v;S.sheet=null;window.scrollTo(0,0)}
  else if(a==='filter')S.filter=v;
  else if(a==='loc')S.loc=v;
  else if(a==='reset'){S.inv=JSON.parse(INIT);S.doneList=[];S.rej=[];S.alt={};S.meals=4;S.log=[];S.filter='전체';S.loc='전체';toast('처음 상태로 되돌렸어요')}
  else if(a==='oback')S.order={step:'start',retailer:S.order.retailer,thumb:null,added:false,shelf:{}};
  else if(a==='aback'){S.tab=S.prev||'home';S.pick.clear()}
  else if(a==='gpick'){const n=t.dataset.n;S.pick.has(n)?S.pick.delete(n):S.pick.add(n)}
  else if(a==='gadd'){let c=0;S.pick.forEach(n=>{const k=CATALOG.find(x=>x.n===n);if(k&&!find(n)){S.inv.push({n:k.n,q:k.q,core:k.core,left:k.shelf,ago:0,loc:k.loc,src:'table'});c++}});S.pick.clear();S.tab='plan';S.alt={};S.filter='전체';S.loc='전체';window.scrollTo(0,0);toast(`${c}개를 담았어요. 이번 주 먹을 순서예요`)}
  else if(a==='qty'){S.inv[S.sheet].pct=+v}
  else if(a==='exp'){const it=S.inv[S.sheet];it.left+=+v;it.src='user'}
  else if(a==='open')S.sheet=+t.dataset.i;
  else if(a==='close')S.sheet=null;
  else if(a==='eat'||a==='discard'){const it=S.inv[S.sheet];S.log.push({n:it.n,t:a});S.inv.splice(S.sheet,1);S.sheet=null;toast(a==='eat'?`${it.n}을(를) 다 먹은 걸로 기록했어요`:`${it.n}을(를) 버린 걸로 기록했어요`)}
  else if(a==='vsample'){S.video.url=RECIPES_VIDEO[v].url;S.video.step='input';S.video.pending=v;S.video.rec=RECIPES_VIDEO[v];S.video.step='loading';render();setTimeout(()=>{if(S.video.step==='loading'){S.video.step='confirm';render()}},1100);return}
  else if(a==='vcheck'){const u=(document.getElementById('url').value||'').trim();S.video.url=u;
    const k=Object.keys(RECIPES_VIDEO).find(k=>RECIPES_VIDEO[k].url===u);
    if(k){S.video.rec=RECIPES_VIDEO[k];S.video.step='loading';render();setTimeout(()=>{if(S.video.step==='loading'){S.video.step='confirm';render()}},1100);return}
    S.video.step='unknown'}
  else if(a==='vok')S.video.step='result';
  else if(a==='vman')S.video={step:'manual',url:'',rec:null};
  else if(a==='vmanual'){const title=(document.getElementById('mname').value||'').trim()||'직접 입력한 메뉴';
    const raw=(document.getElementById('ming').value||'').split(/[,，、\n]/).map(x=>x.trim()).filter(Boolean);
    const ing=raw.filter(n=>!BASIC.includes(n)).map(n=>({n,core:coreOf(n)}));
    if(!ing.length){toast('재료를 한 개 이상 적어 주세요')}
    else{const sk=raw.filter(n=>BASIC.includes(n));S.video.rec={title,ing,skip:sk.length?sk:['소금','식용유']};S.video.step='result'}}
  else if(a==='vreset')S.video={step:'input',url:'',rec:null};
  else if(a==='osample'){startOrder(null);return}
  else if(a==='retailer')S.order.retailer=v;
  else if(a==='oadd'){
    ORDER_ITEMS.forEach(i=>{if(find(i.n))return;
      S.inv.push({n:i.n,q:i.q,core:i.core,left:i.shelf+RETAIL[S.order.retailer].checkin-1,ago:0,loc:'냉장',src:i.conf?'label':'table'})});
    S.order={step:'start',retailer:S.order.retailer,thumb:null,added:false,shelf:{}};
    S.tab='plan';S.alt={};window.scrollTo(0,0);toast('냉장고에 넣었어요. 이번 주 먹을 순서예요')}
  else if(a==='meals'){S.meals=+v;S.alt={}}
  else if(a==='swap'){const i=+t.dataset.i;S.alt[i]=(S.alt[i]||0)+1}
  else if(a==='skip'){const sl=makePlan().slots.find(x=>x.i===+t.dataset.i);if(sl&&sl.r){S.rej.push(sl.r.n);S.alt={};toast(`${sl.r.n}은(는) 건너뛰었어요`)}}
  else if(a==='rejclear'){S.rej=[];S.alt={}}
  else if(a==='meal-ok'){const sl=makePlan().slots.find(x=>x.i===+t.dataset.i);
    if(sl&&sl.r){const removed=[],ids=[],soonUsed=[];
      sl.r.uses.forEach(n=>{const k=S.inv.findIndex(i=>i.n===n);if(k>=0){const it=S.inv.splice(k,1)[0];if(stateOf(it)==='soon')soonUsed.push(n);removed.push(it);const id=Date.now()+Math.random();ids.push(id);S.log.push({id,n,t:'eat'})}});
      S.doneList.push({r:sl.r,removed,ids,soonUsed});S.alt={};toast(`${sl.r.n}에 쓴 재료를 냉장고에서 뺐어요`)}}
  else if(a==='undo'){const k=+t.dataset.i,d=S.doneList[k];
    if(d){d.removed.forEach(it=>S.inv.push(it));S.log=S.log.filter(l=>!d.ids.includes(l.id));S.doneList.splice(k,1);S.alt={};toast(`${d.r.n}에 쓴 재료를 냉장고로 되돌렸어요`)}}
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='shelf'){S.order.shelf[t.dataset.n]=t.value;render()}
});
load();render();
</script>
